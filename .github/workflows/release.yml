name: MediaAIStudio Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore debug keystore
        shell: bash
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build release APK
        id: release_build
        shell: bash
        env:
          RELEASE_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$RELEASE_KEYSTORE_PATH" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "Production signing credentials detected."
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Production signing credentials are not configured; release APK will be debug-signed for development distribution."
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
          fi

          gradle :app:assembleRelease --stacktrace 2>&1 | tee release-build.log
          status=${PIPESTATUS[0]}
          test "$status" -eq 0
          compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null
          echo "asset_glob=app/build/outputs/apk/release/*.apk" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode =' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_GLOB: ${{ steps.release_build.outputs.asset_glob }}
          SIGNED: ${{ steps.release_build.outputs.release_signed }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          tag="v${VERSION_NAME}"
          apk=$(compgen -G "$ASSET_GLOB" | head -n1)
          test -n "$apk"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading the rebuilt APK to it."
            gh release upload "$tag" "$apk" --clobber
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "MediaAIStudio $VERSION_NAME"
            git push origin "$tag"
          fi

          if [ "$SIGNED" = "true" ]; then
            title="MediaAIStudio $VERSION_NAME"
            notes="MediaAIStudio $VERSION_NAME (versionCode $VERSION_CODE)\n\nDedicated on-device AI camera mode added. AI capture applies the existing CPGA low-light enhancement and Real-ESRGAN 2x pipeline."
            gh release create "$tag" "$apk" --title "$title" --notes "$notes"
          else
            title="MediaAIStudio $VERSION_NAME — Development Build"
            notes="MediaAIStudio $VERSION_NAME (versionCode $VERSION_CODE)\n\nDevelopment release: production signing credentials are not configured in GitHub Actions, so this APK is debug-signed and is not intended to replace an existing production-signed installation.\n\nCamera: dedicated on-device AI mode using the existing CPGA low-light and Real-ESRGAN 2x pipeline."
            gh release create "$tag" "$apk" --prerelease --title "$title" --notes "$notes"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: warn
