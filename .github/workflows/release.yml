name: MediaAIStudio Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MEDIA_AI_BACKEND_URL: ${{ secrets.MEDIA_AI_BACKEND_URL }}
      MEDIA_AI_BACKEND_API_KEY: ${{ secrets.MEDIA_AI_BACKEND_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Production Keystore
        id: setup_keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PATH_SECRET: ${{ secrets.RELEASE_KEYSTORE_PATH }}
        run: |
          set -o pipefail
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding RELEASE_KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "RELEASE_KEYSTORE_PATH=/tmp/release.keystore" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_KEYSTORE_PATH_SECRET" ] && [ -f "$RELEASE_KEYSTORE_PATH_SECRET" ]; then
            echo "Using keystore from RELEASE_KEYSTORE_PATH..."
            echo "RELEASE_KEYSTORE_PATH=$RELEASE_KEYSTORE_PATH_SECRET" >> "$GITHUB_ENV"
          else
            echo "::error::Permanent release signing keystore is not provided! Configure RELEASE_KEYSTORE_BASE64 in GitHub Secrets."
            exit 1
          fi

      - name: Build release APK
        id: release_build
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -o pipefail
          if [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Permanent production signing secrets (RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) are not fully configured in GitHub Secrets! Release builds must not fall back to ephemeral debug keys."
            exit 1
          fi

          gradle :app:assembleRelease --stacktrace 2>&1 | tee release-build.log
          status=${PIPESTATUS[0]}
          test "$status" -eq 0

          compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null
          echo "asset_glob=app/build/outputs/apk/release/*.apk" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode =' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Verify Release APK Package, Version, and Permanent Signature
        id: verify_apk
        shell: bash
        env:
          ASSET_GLOB: ${{ steps.release_build.outputs.asset_glob }}
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_CERT_SECRET: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -o pipefail
          apk=$(compgen -G "$ASSET_GLOB" | head -n1)
          test -f "$apk"

          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n1)
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in Android SDK!"
            exit 1
          fi

          echo "Verifying APK signature using apksigner..."
          SIG_OUTPUT=$("$APKSIGNER" verify --print-certs -v "$apk")

          ACTUAL_SHA256=$(echo "$SIG_OUTPUT" | grep -m1 "SHA-256 digest:" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
          ACTUAL_SHA1=$(echo "$SIG_OUTPUT" | grep -m1 "SHA-1 digest:" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')

          EXPECTED_SHA256=$(echo "${RELEASE_CERT_SECRET:-62a820f073d4797e2da54338d447b0317d225f501c4e9b8811d8a30c8494ab74}" | tr '[:upper:]' '[:lower:]' | tr -d ':')

          echo "=========================================="
          echo "  Release APK Verification Fingerprints:  "
          echo "  Actual Certificate SHA-256:   $ACTUAL_SHA256"
          echo "  Actual Certificate SHA-1:     $ACTUAL_SHA1"
          echo "  Expected Permanent SHA-256:   $EXPECTED_SHA256"
          echo "=========================================="

          # Clean up decrypted temporary keystore immediately
          rm -f /tmp/release.keystore

          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Unable to extract certificate SHA-256 fingerprint from release APK!"
            exit 1
          fi

          if [ -n "$EXPECTED_SHA256" ] && [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::SIGNER MISMATCH! APK signing SHA-256 ($ACTUAL_SHA256) does not match the permanent release certificate ($EXPECTED_SHA256). Aborting release."
            exit 1
          fi

          # Calculate APK file SHA-256 checksum
          APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$ACTUAL_SHA256" >> "$GITHUB_OUTPUT"

          # Write standalone checksum asset
          echo "$APK_SHA256  $(basename "$apk")" > "${apk}.sha256"

          echo "Success: Release APK verified with permanent signing key."
          echo "APK File SHA-256: $APK_SHA256"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_GLOB: ${{ steps.release_build.outputs.asset_glob }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_SHA256: ${{ steps.verify_apk.outputs.apk_sha256 }}
          CERT_SHA256: ${{ steps.verify_apk.outputs.cert_sha256 }}
        run: |
          tag="v${VERSION_NAME}"
          apk=$(compgen -G "$ASSET_GLOB" | head -n1)
          test -n "$apk"
          checksum_asset="${apk}.sha256"

          title="MediaAIStudio $VERSION_NAME"
          notes=$(printf "MediaAIStudio %s (versionCode %s)\n\nSHA256: %s\nCertificate SHA-256: %s\n\nSigned with the official permanent release key.\nNote: Installations previously signed with the legacy temporary v1.3.4 debug key cannot be updated in-place and require a clean install." "$VERSION_NAME" "$VERSION_CODE" "$APK_SHA256" "$CERT_SHA256")

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading rebuilt APK and checksum..."
            gh release upload "$tag" "$apk" "$checksum_asset" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease=false
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "MediaAIStudio $VERSION_NAME"
            git push origin "$tag"
          fi

          gh release create "$tag" "$apk" "$checksum_asset" --title "$title" --notes "$notes"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: warn
