name: MediaAIStudio Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Production Keystore
        id: setup_keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PATH_SECRET: ${{ secrets.RELEASE_KEYSTORE_PATH }}
        run: |
          set -o pipefail
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding RELEASE_KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "RELEASE_KEYSTORE_PATH=/tmp/release.keystore" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_KEYSTORE_PATH_SECRET" ] && [ -f "$RELEASE_KEYSTORE_PATH_SECRET" ]; then
            echo "Using keystore from RELEASE_KEYSTORE_PATH..."
            echo "RELEASE_KEYSTORE_PATH=$RELEASE_KEYSTORE_PATH_SECRET" >> "$GITHUB_ENV"
          else
            echo "::error::Release signing keystore is not provided! Configure RELEASE_KEYSTORE_BASE64 in GitHub Secrets."
            exit 1
          fi

      - name: Build release APK
        id: release_build
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Production signing secrets (RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) are not fully configured in GitHub Secrets!"
            exit 1
          fi

          gradle :app:assembleRelease --stacktrace 2>&1 | tee release-build.log
          status=${PIPESTATUS[0]}
          test "$status" -eq 0

          compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null
          echo "asset_glob=app/build/outputs/apk/release/*.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK Signature against v1.3.4
        shell: bash
        env:
          ASSET_GLOB: ${{ steps.release_build.outputs.asset_glob }}
        run: |
          set -o pipefail
          apk=$(compgen -G "$ASSET_GLOB" | head -n1)
          test -f "$apk"

          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n1)
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in Android SDK!"
            exit 1
          fi

          echo "Verifying APK signature using apksigner..."
          SIG_OUTPUT=$("$APKSIGNER" verify --print-certs -v "$apk")

          ACTUAL_SHA256=$(echo "$SIG_OUTPUT" | grep -m1 "SHA-256 digest:" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          ACTUAL_SHA1=$(echo "$SIG_OUTPUT" | grep -m1 "SHA-1 digest:" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')

          EXPECTED_SHA256="640f9c91c20ef22ad98ea56dc4db86ed7a8806324cc1d3612677bc472736ec8c"
          EXPECTED_SHA1="e0c509d9d33a2fa59d8ce58cf20c3649adb3a6ac"

          echo "=========================================="
          echo "  Release APK Verification Fingerprints:  "
          echo "  SHA-256: $ACTUAL_SHA256"
          echo "  SHA-1:   $ACTUAL_SHA1"
          echo "  Expected SHA-256 (v1.3.4): $EXPECTED_SHA256"
          echo "  Expected SHA-1   (v1.3.4): $EXPECTED_SHA1"
          echo "=========================================="

          # Clean up decrypted temporary keystore immediately
          rm -f /tmp/release.keystore

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::SIGNER MISMATCH! APK signing SHA-256 ($ACTUAL_SHA256) does not match the baseline v1.3.4 certificate ($EXPECTED_SHA256). Aborting release to prevent INSTALL_FAILED_UPDATE_INCOMPATIBLE."
            exit 1
          fi

          echo "Success: Release APK signature verified and matches v1.3.4."

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode =' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_GLOB: ${{ steps.release_build.outputs.asset_glob }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          tag="v${VERSION_NAME}"
          apk=$(compgen -G "$ASSET_GLOB" | head -n1)
          test -n "$apk"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading the rebuilt APK to it and keeping it as the latest normal release."
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --prerelease=false
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "MediaAIStudio $VERSION_NAME"
            git push origin "$tag"
          fi

          title="MediaAIStudio $VERSION_NAME"
          notes="MediaAIStudio $VERSION_NAME (versionCode $VERSION_CODE)\\n\\nSigned with the verified v1.3.4 compatible release certificate.\\nEnsures seamless update compatibility without INSTALL_FAILED_UPDATE_INCOMPATIBLE."
          gh release create "$tag" "$apk" --title "$title" --notes "$notes"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: warn
