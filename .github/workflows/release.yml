name: MediaAIStudio Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android version
    env:
      MEDIA_AI_BACKEND_URL: ${{ secrets.MEDIA_AI_BACKEND_URL }}
      MEDIA_AI_BACKEND_API_KEY: ${{ secrets.MEDIA_AI_BACKEND_API_KEY }}
      PERMANENT_RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate backend JavaScript syntax
        run: |
          node --check "../PC version/backend/src/index.js"
          node --check "../PC version/backend/src/api/generate.js"
          node --check "../PC version/backend/src/ai/GenerativeService.js"
          node --check "../PC version/backend/src/jobs/JobManager.js"
          node --check "../PC version/backend/src/storage/StorageManager.js"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate production signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PATH_SECRET: ${{ secrets.RELEASE_KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] && [ -z "$RELEASE_KEYSTORE_PATH_SECRET" ]; then missing+=(RELEASE_KEYSTORE_BASE64); fi
          [ -n "$RELEASE_STORE_PASSWORD" ] || missing+=(RELEASE_STORE_PASSWORD)
          [ -n "$RELEASE_KEY_ALIAS" ] || missing+=(RELEASE_KEY_ALIAS)
          [ -n "$RELEASE_KEY_PASSWORD" ] || missing+=(RELEASE_KEY_PASSWORD)
          [ -n "$RELEASE_CERT_SHA256" ] || missing+=(RELEASE_CERT_SHA256)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required signing secrets: ${missing[*]}"
            echo "Configure them in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          normalized=$(echo "$RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          if ! [[ "$normalized" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::RELEASE_CERT_SHA256 must be a 64-character SHA-256 fingerprint."
            exit 1
          fi

      - name: Set up Production Keystore
        id: setup_keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PATH_SECRET: ${{ secrets.RELEASE_KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding RELEASE_KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "RELEASE_KEYSTORE_PATH=/tmp/release.keystore" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_KEYSTORE_PATH_SECRET" ] && [ -f "$RELEASE_KEYSTORE_PATH_SECRET" ]; then
            echo "Using keystore from RELEASE_KEYSTORE_PATH..."
            echo "RELEASE_KEYSTORE_PATH=$RELEASE_KEYSTORE_PATH_SECRET" >> "$GITHUB_ENV"
          else
            echo "::error::Permanent release signing keystore is not provided! Configure RELEASE_KEYSTORE_BASE64 in GitHub Secrets."
            exit 1
          fi
          keytool -list -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null

      - name: Build release APK
        id: release_build
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -o pipefail
          if [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Permanent production signing secrets are not fully configured."
            exit 1
          fi
          gradle :app:assembleRelease --stacktrace 2>&1 | tee release-build.log
          status=${PIPESTATUS[0]}
          test "$status" -eq 0
          compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null
          echo "asset_dir=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          version_code=$(grep -m1 'versionCode =' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Verify Release APK Package, Version, and Permanent Signature
        id: verify_apk
        shell: bash
        env:
          ASSET_DIR: ${{ steps.release_build.outputs.asset_dir }}
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_CERT_SECRET: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -o pipefail
          shopt -s nullglob
          apks=( "$ASSET_DIR"/*.apk )
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No ABI-specific Release APKs were produced."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n1)
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in Android SDK!"
            exit 1
          fi
          EXPECTED_SHA256=$(echo "$RELEASE_CERT_SECRET" | tr '[:upper:]' '[:lower:]' | tr -d ':')
          CERT_FINGERPRINT=""
          for apk in "${apks[@]}"; do
            echo "Verifying $(basename "$apk")..."
            "$APKSIGNER" verify --print-certs -v "$apk" > signer.txt
            ACTUAL_SHA256=$(grep -m1 "Signer #1 certificate SHA-256 digest:" signer.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
            if [ -z "$ACTUAL_SHA256" ]; then
              ACTUAL_SHA256=$(grep -m1 "SHA-256 digest:" signer.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
            fi
            if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Missing or mismatched permanent signature for $(basename "$apk")."
              exit 1
            fi
            if [ -n "$CERT_FINGERPRINT" ] && [ "$CERT_FINGERPRINT" != "$ACTUAL_SHA256" ]; then
              echo "::error::ABI APKs were signed by different certificates."
              exit 1
            fi
            CERT_FINGERPRINT="$ACTUAL_SHA256"
            APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')
            echo "$APK_SHA256  $(basename "$apk")" > "${apk}.sha256"
          done
          rm -f /tmp/release.keystore signer.txt
          echo "cert_sha256=$CERT_FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIR: ${{ steps.release_build.outputs.asset_dir }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          CERT_SHA256: ${{ steps.verify_apk.outputs.cert_sha256 }}
        run: |
          tag="v${VERSION_NAME}"
          shopt -s nullglob
          apks=( "$ASSET_DIR"/*.apk )
          assets=()
          for apk in "${apks[@]}"; do
            assets+=("$apk" "${apk}.sha256")
          done
          test "${#assets[@]}" -gt 0
          title="MediaAIStudio $VERSION_NAME"
          notes=$(printf "MediaAIStudio %s (versionCode %s)\n\nFour ABI-specific APKs are provided (arm64-v8a, armeabi-v7a, x86, x86_64). Install the APK matching your device CPU architecture.\n\nAll APKs passed apksigner verification with permanent certificate SHA-256: %s.\n\nChecksums are attached beside each APK." "$VERSION_NAME" "$VERSION_CODE" "$CERT_SHA256")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease=false
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "MediaAIStudio $VERSION_NAME"
            git push origin "$tag"
          fi
          gh release create "$tag" "${assets[@]}" --title "$title" --notes "$notes"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: Android version/release-build.log
          if-no-files-found: warn
