name: MediaAIStudio PC workspace
on:
  pull_request:
    paths:
      - "pc/**"
      - "PC version/**"
      - ".github/workflows/pc-web.yml"
  push:
    branches: [main]
    paths:
      - "pc/**"
      - "PC version/**"
      - "PC version/**"
      - ".github/workflows/pc-web.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
  build-windows-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate local camera companion JavaScript
        run: |
          node --check "PC version/camera-agent.js"
          node --check "PC version/pc-server.js"
          node --check "PC version/backend/src/index.js"
      - name: Install Windows workspace web dependencies
        working-directory: PC version/web
        run: npm install
      - name: Build Windows workspace web app
        working-directory: PC version/web
        run: npm run build

      - name: Package portable Windows setup folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pc-package"
          cp -a "PC version" "$RUNNER_TEMP/pc-package/MediaAIStudio"
          find "$RUNNER_TEMP/pc-package/MediaAIStudio" -type d -name node_modules -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/pc-package/MediaAIStudio" -type f -name ".env" -delete
          rm -rf "$RUNNER_TEMP/pc-package/MediaAIStudio/logs"
          cd "$RUNNER_TEMP/pc-package"
          zip -qr "$RUNNER_TEMP/MediaAIStudio-PC-Setup.zip" MediaAIStudio
      - name: Upload portable Windows setup package
        uses: actions/upload-artifact@v4
        with:
          name: MediaAIStudio-PC-Setup
          path: ${{ runner.temp }}/MediaAIStudio-PC-Setup.zip
          if-no-files-found: error
          retention-days: 30
