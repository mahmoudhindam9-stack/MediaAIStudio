name: MediaAIStudio PC workspace
on:
  pull_request:
    paths:
      - "pc/**"
      - "PC version/**"
      - ".github/workflows/pc-web.yml"
  push:
    branches: [main]
    paths:
      - "pc/**"
      - "PC version/**"
      - ".github/workflows/pc-web.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
  build-windows-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate local camera companion JavaScript
        run: |
          node --check "PC version/camera-agent.js"
          node --check "PC version/pc-server.js"
          node --check "PC version/backend/src/index.js"
      - name: Install Windows workspace web dependencies
        working-directory: PC version/web
        run: npm install
      - name: Build Windows workspace web app
        working-directory: PC version/web
        run: npm run build
