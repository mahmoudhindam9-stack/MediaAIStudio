name: Android Debug Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore debug keystore
        shell: bash
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile Kotlin and capture diagnostics
        shell: bash
        run: |
          set +e
          gradle :app:compileDebugKotlin --stacktrace 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          echo "GRADLE_EXIT_CODE=$status" >> compile.log
          exit "$status"

      - name: Upload Kotlin compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-compile-diagnostics
          path: compile.log
          if-no-files-found: error

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint debug
        run: gradle lintDebug --stacktrace

      - name: Assemble debug
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaAIStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
